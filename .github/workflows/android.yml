name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/android
          npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist

          cp index.html dist/

          if [ -f style.css ]; then
            cp style.css dist/
          fi

          if [ -f app.js ]; then
            cp app.js dist/
          fi

          if [ -f sw.js ]; then
            cp sw.js dist/
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest dist/
          fi

          if [ -f manifest.json ]; then
            cp manifest.json dist/
          fi

          if [ -d assets ]; then
            cp -R assets dist/
          fi

      - name: Fix Capacitor config
        run: |
          if [ -f capacitor.config.ts ]; then
            echo "TypeScript Capacitor config found"
          elif [ -f capacitor.config.json ]; then
            echo "JSON Capacitor config found"
          else
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.amarbeton.app",
            "appName": "Amar Beton",
            "webDir": "dist"
          }
          EOF
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Beton-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
